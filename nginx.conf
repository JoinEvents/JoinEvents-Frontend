server {
    listen 8080;
    server_name localhost;

    # ── Security Headers ──────────────────────────────────────────
    
    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # Prevent clickjacking — deny all framing
    add_header X-Frame-Options "DENY" always;
    
    # Enable XSS filter in browsers that support it
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Enforce HTTPS (1 year, include subdomains)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Referrer policy — only send origin on cross-origin requests
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Permissions policy — disable unnecessary browser features
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    
    # Content Security Policy
    # Allows: self, Google Fonts, Bootstrap Icons CDN, inline styles (Angular needs this)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; connect-src 'self' https://joinevents-api-347123938976.europe-west1.run.app https://maps.googleapis.com; frame-ancestors 'none';" always;

    # ── Application Serving ───────────────────────────────────────

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
